name: Release

# The release workflow is shared by every KS-Suite Kotlin app and lives in ks-utility
# (https://github.com/kumasumit/ks-utility/blob/main/specs/release-workflow.md).
# This file only names KS - TV Launcher's platforms.
#
#   Tag push google-tv-vX.Y.Z     Builds and verifies the signed APK and AAB, then publishes the
#                                 GitHub Release ("for Google TV", not marked latest). A plain
#                                 vX.Y.Z also works and is marked latest.
#   Manual run (rehearsal)        Builds and checks everything for the version given; never publishes.

on:
  push:
    tags: ["google-tv-v*.*.*", "v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse, X.Y.Z. Builds everything, releases nothing."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: kumasumit/ks-utility/.github/workflows/kotlin-app-release.yml@v0.13.2
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      version: ${{ inputs.version }}
      app-name: ks-tv-launcher
      display-name: KS - TV Launcher
      # A TV-only app: the TV app is the workflow's tv-module, so a google-tv-vX.Y.Z tag (the suite's
      # platform tags) builds and releases it. Files: app-release-google-tv.apk and .aab, the name
      # the in-app update check looks for (specs/app-updates.md).
      tv-module: ":tv:google-tv"
      android-file-name: app-release
    secrets: inherit
